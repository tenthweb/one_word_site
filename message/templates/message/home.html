<!DOCTYPE html>
<html>
<head>
    <title>Message</title>
</head>
<body>
    <h1>{{ message.text }}</h1>

    {% if user.is_authenticated %}
        <p>You are logged in as {{ user.username }}.</p>
        <a href="{% url 'edit' %}">Edit the message</a>
        <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
</form>
    {% else %}
        <a href="{% url 'login' %}">Log in</a>
    {% endif %}
</body>
</html>
